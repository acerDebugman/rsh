[package]
name = "rsh"
version = "0.1.0"
edition = "2024"
description = "A terminal coding agent with a hand-written tool loop"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-width = "0.2"
unicode-segmentation = "1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["bracketed-paste"] }
toml = "0.8"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
# Justified: `setsid` + `killpg` so a timed-out `sh -c` cannot leave rustc or
# pytest grandchildren running as orphans.
libc = "0.2"

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3"
