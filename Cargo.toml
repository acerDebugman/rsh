[package]
name = "rsh"
version = "0.1.0"
edition = "2024"
description = "A terminal coding agent with a hand-written tool loop"
license = "MIT"

[dependencies]
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
